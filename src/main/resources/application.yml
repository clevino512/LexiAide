spring:
  application:
    name: lexiaide-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  address: 0.0.0.0
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.lexiaide: INFO
