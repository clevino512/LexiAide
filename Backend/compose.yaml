services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexiaide}
      POSTGRES_USER: ${POSTGRES_USER:-lexiaide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexiaide_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lexiaide}
      DB_USERNAME: ${POSTGRES_USER:-lexiaide}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lexiaide_dev}
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/api/v1/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
